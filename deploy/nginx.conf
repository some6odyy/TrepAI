# Nginx como proxy reverso hacia gunicorn+uvicorn (puerto 8000, solo localhost).
# Copiar a /etc/nginx/sites-available/trepai y enlazar en sites-enabled.
#
# Después de instalar esto, correr:
#   sudo certbot --nginx -d tu-dominio.cl
# para HTTPS automático (obligatorio: Meta exige HTTPS para el webhook de
# WhatsApp — no acepta callbacks por HTTP plano).

server {
    listen 80;
    server_name tu-dominio.cl;

    # El webhook de WhatsApp puede mandar payloads con varios mensajes:
    # subimos el límite por si acaso.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El webhook debe responder rápido (RNF-01), pero dejamos margen
        # para la llamada a la IA.
        proxy_read_timeout 30s;
    }
}
